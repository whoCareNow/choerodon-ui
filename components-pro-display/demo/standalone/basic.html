<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pro Display UMD — 基础示例</title>
  <link rel="stylesheet" href="../../../dist/choerodon-ui-pro-display.min.css" />
  <style>
    body { margin: 24px; }
    .row { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Button / Form / Table</h1>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@16.14.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@16.14.0/umd/react-dom.production.min.js"></script>
  <script src="../../../dist/choerodon-ui-pro-display.min.js"></script>
  <script src="./umd-boot.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <script type="text/babel">
    try {
    const { Button, Form, Table } = getChoerodonProDisplay();

    const columns = [
      { title: '姓名', dataIndex: 'name' },
      { title: '年龄', dataIndex: 'age', width: 80 },
    ];
    const dataSource = [
      { id: '1', name: '张三', age: 28 },
      { id: '2', name: '李四', age: 32 },
    ];

    function App() {
      return (
        <div>
          <div className="row">
            <Button color="primary">Primary</Button>
            <Button style={{ marginLeft: 8 }}>Default</Button>
          </div>
          <Form labelWidth={80}>
            <Form.Item label="备注">
              <input style={{ width: 240, height: 32, padding: '0 8px' }} placeholder="Form.Item + 原生 input" />
            </Form.Item>
          </Form>
          <Table columns={columns} dataSource={dataSource} rowKey="id" bordered style={{ marginTop: 16 }} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    } catch (err) {
      document.getElementById('root').innerHTML = '<pre style="color:#cf1322;white-space:pre-wrap">' + err.message + '</pre>';
      console.error(err);
    }
  </script>
</body>
</html>
